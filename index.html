<!doctype html>
<html lang="fr" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LivrExpress Bénin — Logistique de Précision &amp; Livraison Express 24h/24</title>
  <meta name="description"
    content="LivrExpress — Entreprise de livraison rapide au Bénin. Service professionnel, traçabilité télémétrique et disponibilité 24h/24 à Cotonou, Calavi, Porto-Novo et Parakou." />
  <!-- Google Fonts — Preset A: Tech Organique -->

  <link

<body class="bg-[#F2F0E9] text-[#1A1A1A] antialiased selection:bg-[#CC5833] selection:text-[#F2F0E9] overflow-x-hidden">
  <!-- Overlay de bruit global SVG <feTurbulence> à 0.05 d'opacité -->
  <svg class="pointer-events-none fixed inset-0 z-[9999] h-full w-full opacity-[0.05]" aria-hidden="true">
    <filter id="organic-noise-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#organic-noise-filter)" />
  </svg>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
